[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-checkpoint"
version = "0.1.0"
description = "Coverage-guided incremental CI for AI-authored code"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agent Checkpoint contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
coverage = ["coverage>=7.3", "pytest-cov>=4.1"]
static = ["ruff>=0.5"]
test = ["pytest>=7.4"]

[project.scripts]
agent-checkpoint = "agent_checkpoint.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_checkpoint"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
